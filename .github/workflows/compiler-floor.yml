name: Compiler Floor Audit

on:
  push:
    branches:
      - research/compiler-floor-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DMD 2.107.1 / frontend 2.107
            compiler: dmd-2.107.1

          - name: LDC 1.37.0 / frontend 2.107
            compiler: ldc-1.37.0

          - name: DMD 2.106.1 / frontend 2.106
            compiler: dmd-2.106.1

          - name: LDC 1.36.0 / frontend 2.106
            compiler: ldc-1.36.0

          - name: DMD 2.105.2 / frontend 2.105
            compiler: dmd-2.105.2

          - name: LDC 1.35.0 / frontend 2.105
            compiler: ldc-1.35.0

          - name: DMD 2.104.2 / frontend 2.104
            compiler: dmd-2.104.2

          - name: LDC 1.34.0 / frontend 2.104
            compiler: ldc-1.34.0

          - name: DMD 2.103.1 / frontend 2.103
            compiler: dmd-2.103.1

          - name: LDC 1.33.0 / frontend 2.103
            compiler: ldc-1.33.0

          - name: DMD 2.102.2 / frontend 2.102
            compiler: dmd-2.102.2

          - name: LDC 1.32.0 / frontend 2.102
            compiler: ldc-1.32.0

          - name: DMD 2.101.2 / frontend 2.101
            compiler: dmd-2.101.2

          - name: LDC 1.31.0 / frontend 2.101
            compiler: ldc-1.31.0

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: latest
          dc_format: shortname

      - name: Environment
        shell: bash
        run: |
          echo "Requested compiler: ${{ matrix.compiler }}"
          echo "DC:                 $DC"
          echo

          "$DC" --version
          dub --version

      - name: Build
        shell: bash
        run: |
          dub build --compiler="$DC"

      - name: Test
        shell: bash
        run: |
          dub test --compiler="$DC"

      - name: Raster lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_lifetime.sh "$DC"

      - name: Raster construction lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_construction_lifetime.sh "$DC"

      - name: Raster owned-resource compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_owned_resource.sh "$DC"

      - name: Raster public-import compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_import_public.sh "$DC"

      - name: Raster execution lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_execution_lifetime.sh "$DC"

      - name: Raster target lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_target_lifetime.sh "$DC"

      - name: Raster writable-view lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_writable_view_lifetime.sh "$DC"
