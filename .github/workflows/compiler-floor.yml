name: Compiler Floor

on:
  push:
    branches:
      - main
      # Temporary validation trigger; remove after the research-branch run passes.
      - research/compiler-floor-audit
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 / DMD 2.101.2
            os: ubuntu-24.04
            compiler: dmd-2.101.2
            dub: 1.40.0

          - name: Linux x86-64 / LDC 1.31.0
            os: ubuntu-24.04
            compiler: ldc-1.31.0
            dub: 1.40.0

          - name: Linux ARM64 / LDC 1.31.0
            os: ubuntu-24.04-arm
            compiler: ldc-1.31.0
            dub: any

          - name: Windows x86-64 / DMD 2.101.2
            os: windows-2025
            compiler: dmd-2.101.2
            dub: 1.40.0

          - name: Windows x86-64 / LDC 1.31.0
            os: windows-2025
            compiler: ldc-1.31.0
            dub: 1.40.0

          - name: macOS x86-64 / DMD 2.112.1
            os: macos-15-intel
            compiler: dmd-2.112.1
            dub: 1.40.0

          - name: macOS x86-64 / LDC 1.41.0
            os: macos-15-intel
            compiler: ldc-1.41.0
            dub: 1.40.0

          - name: macOS ARM64 / LDC 1.41.0
            os: macos-15
            compiler: ldc-1.41.0
            dub: 1.40.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install minimum supported D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: ${{ matrix.dub }}
          dc_format: shortname

      - name: Environment
        shell: bash
        run: |
          echo "Runner OS:            $RUNNER_OS"
          echo "Runner arch:          $RUNNER_ARCH"
          echo "Requested compiler:   ${{ matrix.compiler }}"
          echo "Requested DUB policy: ${{ matrix.dub }}"
          echo "DC:                   $DC"
          echo

          "$DC" --version
          dub --version

      - name: Build
        shell: bash
        run: |
          dub build --compiler="$DC"

      - name: Test
        shell: bash
        run: |
          dub test --compiler="$DC"

      - name: Raster lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_lifetime.sh "$DC"

      - name: Raster construction lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_construction_lifetime.sh "$DC"

      - name: Raster owned-resource compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_owned_resource.sh "$DC"

      - name: Raster public-import compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_import_public.sh "$DC"

      - name: Raster execution lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_execution_lifetime.sh "$DC"

      - name: Raster target lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_target_lifetime.sh "$DC"

      - name: Raster writable-view lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_writable_view_lifetime.sh "$DC"
