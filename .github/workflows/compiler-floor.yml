name: Compiler Floor Audit

on:
  push:
    branches:
      - research/compiler-floor-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DMD 2.100.2 / frontend 2.100
            compiler: dmd-2.100.2

          - name: LDC 1.30.0 / frontend 2.100
            compiler: ldc-1.30.0

          - name: DMD 2.099.1 / frontend 2.099
            compiler: dmd-2.099.1

          - name: LDC 1.29.0 / frontend 2.099
            compiler: ldc-1.29.0

          - name: DMD 2.098.1 / frontend 2.098
            compiler: dmd-2.098.1

          - name: LDC 1.28.1 / frontend 2.098
            compiler: ldc-1.28.1

          - name: DMD 2.097.2 / frontend 2.097
            compiler: dmd-2.097.2

          - name: LDC 1.27.1 / frontend 2.097
            compiler: ldc-1.27.1

          - name: DMD 2.096.1 / frontend 2.096
            compiler: dmd-2.096.1

          - name: LDC 1.26.0 / frontend 2.096
            compiler: ldc-1.26.0

          - name: DMD 2.095.1 / frontend 2.095
            compiler: dmd-2.095.1

          - name: LDC 1.25.0 / frontend 2.095
            compiler: ldc-1.25.0

          - name: DMD 2.094.2 / frontend 2.094
            compiler: dmd-2.094.2

          - name: LDC 1.24.0 / frontend 2.094
            compiler: ldc-1.24.0

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: latest
          dc_format: shortname

      - name: Environment
        shell: bash
        run: |
          echo "Requested compiler: ${{ matrix.compiler }}"
          echo "DC:                 $DC"
          echo

          "$DC" --version
          dub --version

      - name: Build
        shell: bash
        run: |
          dub build --compiler="$DC"

      - name: Test
        shell: bash
        run: |
          dub test --compiler="$DC"

      - name: Raster lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_lifetime.sh "$DC"

      - name: Raster construction lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_construction_lifetime.sh "$DC"

      - name: Raster owned-resource compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_owned_resource.sh "$DC"

      - name: Raster public-import compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_import_public.sh "$DC"

      - name: Raster execution lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_execution_lifetime.sh "$DC"

      - name: Raster target lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_target_lifetime.sh "$DC"

      - name: Raster writable-view lifetime compile probes
        shell: bash
        run: |
          tools/compile-negative/raster_writable_view_lifetime.sh "$DC"
